<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; }
  :root { --paavari: #2563eb; }
  body {
    font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
    margin: 0; display: flex; flex-direction: column; height: 100vh;
    background: white;
  }

  #header {
    position: relative;
    background: var(--paavari);
    color: white;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    font-size: 16px;
  }
  #header img {
    width: 32px; height: 32px;
    border-radius: 50%;
    object-fit: cover;
    background: white;
  }
  #sulje {
    position: absolute;
    top: 12px;
    right: 12px;
    background: none;
    border: none;
    color: white;
    font-size: 20px;
    cursor: pointer;
    line-height: 1;
    padding: 4px 8px;
  }
  #sulje:hover { opacity: 0.7; }

  #tyhjenna {
    position: absolute;
    top: 12px;
    right: 48px;
    background: none;
    border: none;
    color: white;
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
    padding: 4px 8px;
  }
  #tyhjenna:hover { opacity: 0.7; }

  #chat {
    flex: 1; padding: 16px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 10px;
    background: white;
  }

  .rivi { display: flex; align-items: flex-end; gap: 8px; }
  .rivi.kayttaja { justify-content: flex-end; }

  .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--paavari); color: white;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0;
  }

  .kupla {
    max-width: 75%; padding: 10px 14px; border-radius: 16px;
    font-size: 14px; line-height: 1.4;
  }
  .kayttaja .kupla {
    background: var(--paavari); color: white; border-bottom-right-radius: 4px;
  }
  .botti .kupla {
    background: #f1f3f5; color: #1f2937; border-bottom-left-radius: 4px;
  }

  #pikavalinnat {
    display: flex; flex-wrap: wrap; gap: 8px;
    padding: 0 16px 12px;
  }
  .pikanappi {
    background: white;
    border: 1px solid var(--paavari);
    color: var(--paavari);
    padding: 8px 14px;
    border-radius: 16px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .pikanappi:hover {
    background: var(--paavari);
    color: white;
  }

  #lomake, #kalenteri, #palaute {
    padding: 16px;
    display: flex; flex-direction: column; gap: 14px;
    background: #fafafa;
    border-radius: 12px;
    margin: 0 16px 12px;
  }
  .lomake-kentta {
    display: flex; flex-direction: column; gap: 6px;
  }
  .lomake-kentta label {
    font-size: 13px;
    font-weight: 600;
    color: #1f2937;
  }
  .lomake-kentta label .pakollinen {
    color: var(--paavari);
  }
  #lomake input,
  #lomake textarea,
  #kalenteri input,
  #kalenteri select,
  #palaute textarea {
    padding: 12px 14px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    background: white;
  }
  #lomake input::placeholder,
  #lomake textarea::placeholder,
  #palaute textarea::placeholder {
    color: #9ca3af;
  }
  #lomake input:focus,
  #lomake textarea:focus,
  #kalenteri input:focus,
  #kalenteri select:focus,
  #palaute textarea:focus { border-color: var(--paavari); outline: none; }
  #lomake button,
  #kalenteri button,
  #palaute button {
    background: var(--paavari);
    color: white;
    border: none;
    padding: 12px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 4px;
  }

  #alaosa {
    display: flex; align-items: center;
    padding: 12px; border-top: 1px solid #eee; gap: 8px;
  }
  #syote {
    flex: 1; padding: 10px 14px; border: 1px solid #ddd;
    border-radius: 20px; font-size: 14px; outline: none;
  }
  #syote:focus { border-color: var(--paavari); }
  #laheta {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--paavari); color: white; border: none;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
</style>
</head>
<body>

<div id="header">
  <button id="tyhjenna" title="Aloita uusi keskustelu">↺</button>
  <img id="header-logo" src="" alt="" style="display:none;">
  <span id="header-teksti">Ladataan...</span>
  <button id="sulje">✕</button>
</div>
<div id="chat"></div>
<div id="alaosa">
  <input id="syote" type="text" placeholder="Kirjoita viesti...">
  <button id="laheta">➤</button>
</div>

<script>
const chat = document.getElementById('chat');
const syote = document.getElementById('syote');
const nappi = document.getElementById('laheta');

const urlParametrit = new URLSearchParams(window.location.search);
const asiakas = urlParametrit.get('asiakas') || 'turun-lukko';

function lisaaViesti(teksti, luokka) {
  const rivi = document.createElement('div');
  rivi.className = 'rivi ' + luokka;

  if (luokka === 'botti') {
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = '🤖';
    rivi.appendChild(avatar);
  }

  const kupla = document.createElement('div');
  kupla.className = 'kupla';
  kupla.textContent = teksti;
  rivi.appendChild(kupla);

  chat.appendChild(rivi);
  chat.scrollTop = chat.scrollHeight;
}

function naytaPikavalinnat(vaihtoehdot) {
  const kontti = document.createElement('div');
  kontti.id = 'pikavalinnat';

  vaihtoehdot.forEach(valinta => {
    const nap = document.createElement('button');
    nap.className = 'pikanappi';
    nap.textContent = valinta.teksti;
    nap.addEventListener('click', () => {
      kontti.remove();
      lisaaViesti(valinta.teksti, 'kayttaja');

      if (valinta.alavalinnat) {
        naytaPikavalinnat(valinta.alavalinnat);
      } else if (valinta.varaus) {
        naytaKalenteri(valinta.teksti);
      } else if (valinta.lomake) {
        naytaLomake(valinta.teksti);
      } else if (valinta.palaute) {
        naytaPalaute();
      } else {
        const piilotaToistona = valinta.piilotaToistona === true;
        lahetaValmisKysymys(valinta.kysymys, valinta.teksti, true, piilotaToistona ? valinta.teksti : null);
      }
    });
    kontti.appendChild(nap);
  });

  chat.appendChild(kontti);
  chat.scrollTop = chat.scrollHeight;
}

function naytaKalenteri(palvelu) {
  const kontti = document.createElement('div');
  kontti.id = 'kalenteri';

  const tanaan = new Date().toISOString().split('T')[0];

  kontti.innerHTML = `
    <div class="lomake-kentta">
      <label>Valitse päivä <span class="pakollinen">*</span></label>
      <input type="date" id="kalenteri-paiva" min="${tanaan}">
    </div>
    <div class="lomake-kentta">
      <label>Valitse kellonaika <span class="pakollinen">*</span></label>
      <select id="kalenteri-aika">
        <option value="">Valitse aika</option>
        <option value="08:00">08:00</option>
        <option value="09:00">09:00</option>
        <option value="10:00">10:00</option>
        <option value="11:00">11:00</option>
        <option value="12:00">12:00</option>
        <option value="13:00">13:00</option>
        <option value="14:00">14:00</option>
        <option value="15:00">15:00</option>
        <option value="16:00">16:00</option>
      </select>
    </div>
    <button id="kalenteri-jatka">Jatka</button>
  `;

  chat.appendChild(kontti);
  chat.scrollTop = chat.scrollHeight;

  document.getElementById('kalenteri-jatka').addEventListener('click', () => {
    const paiva = document.getElementById('kalenteri-paiva').value;
    const aika = document.getElementById('kalenteri-aika').value;

    if (!paiva || !aika) {
      alert('Valitse sekä päivä että kellonaika.');
      return;
    }

    kontti.remove();
    naytaLomake(palvelu, paiva, aika);
  });
}

function naytaLomake(palvelu, paiva, aika) {
  const kontti = document.createElement('div');
  kontti.id = 'lomake';

  kontti.innerHTML = `
    <div class="lomake-kentta">
      <label>Nimi <span class="pakollinen">*</span></label>
      <input type="text" id="lomake-nimi" placeholder="Nimi">
    </div>
    <div class="lomake-kentta">
      <label>Puhelinnumero <span class="pakollinen">*</span></label>
      <input type="tel" id="lomake-puhelin" placeholder="Puhelinnumero">
    </div>
    <div class="lomake-kentta">
      <label>Sähköposti <span class="pakollinen">*</span></label>
      <input type="email" id="lomake-sahkoposti" placeholder="Sähköposti">
    </div>
    <div class="lomake-kentta">
      <label>Osoite</label>
      <input type="text" id="lomake-osoite" placeholder="Osoite">
    </div>
    <div class="lomake-kentta">
      <label>Postinumero <span class="pakollinen">*</span></label>
      <input type="text" id="lomake-postinumero" placeholder="Postinumero">
    </div>
    <div class="lomake-kentta">
      <label>Viesti</label>
      <textarea id="lomake-viesti" placeholder="Viesti" rows="3"></textarea>
    </div>
    <button id="lomake-laheta">${paiva ? 'Vahvista varaus' : 'Lähetä tarjouspyyntö'}</button>
  `;

  chat.appendChild(kontti);
  chat.scrollTop = chat.scrollHeight;

  document.getElementById('lomake-laheta').addEventListener('click', async () => {
    const nimi = document.getElementById('lomake-nimi').value.trim();
    const puhelin = document.getElementById('lomake-puhelin').value.trim();
    const sahkoposti = document.getElementById('lomake-sahkoposti').value.trim();
    const osoite = document.getElementById('lomake-osoite').value.trim();
    const postinumero = document.getElementById('lomake-postinumero').value.trim();
    const viesti = document.getElementById('lomake-viesti').value.trim();

    if (!nimi || !puhelin || !sahkoposti || !postinumero) {
      alert('Täytä kaikki pakolliset kentät (*).');
      return;
    }

    kontti.remove();

    try {
      await fetch('/api/tarjous', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ asiakas, palvelu, nimi, puhelin, sahkoposti, osoite, postinumero, viesti, paiva: paiva || '', aika: aika || '' })
      });
    } catch (virhe) {
      console.error('Tallennus epäonnistui', virhe);
    }

    if (paiva && aika) {
      lisaaViesti(`Kiitos! Varauksesi ${paiva} klo ${aika} on vastaanotettu, vahvistamme sen pian.`, 'botti');
    } else {
      lisaaViesti('Kiitos! Olemme sinuun yhteydessä pian tarjouksen kanssa.', 'botti');
    }
  });
}

function naytaPalaute() {
  const kontti = document.createElement('div');
  kontti.id = 'palaute';

  kontti.innerHTML = `
    <textarea id="palaute-teksti" placeholder="Kirjoita palautteesi tähän..." rows="4"></textarea>
    <button id="palaute-laheta">Lähetä palaute</button>
  `;

  chat.appendChild(kontti);
  chat.scrollTop = chat.scrollHeight;

  document.getElementById('palaute-laheta').addEventListener('click', async () => {
    const viesti = document.getElementById('palaute-teksti').value.trim();
    if (!viesti) {
      alert('Kirjoita palaute ennen lähettämistä.');
      return;
    }

    kontti.remove();

    try {
      await fetch('/api/tarjous', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ asiakas, palvelu: 'Palaute', nimi: '', puhelin: '', sahkoposti: '', osoite: '', postinumero: '', viesti })
      });
    } catch (virhe) {
      console.error('Palautteen tallennus epäonnistui', virhe);
    }

  lisaaViesti('Kiitos palautteesta!', 'botti');
    naytaPikavalinnatUudelleen('Muut asiat');
  });
}

async function naytaPikavalinnatUudelleen(poissuljettava) {
  try {
    const asetukset = await fetch('/api/asetukset/' + asiakas).then(r => r.json());
    if (asetukset.vainPikavalinnat && asetukset.pikavalinnat) {
      const lista = poissuljettava
        ? asetukset.pikavalinnat.filter(v => v.teksti !== poissuljettava)
        : asetukset.pikavalinnat;
      naytaPikavalinnat(lista);
    }
  } catch (virhe) {
    console.error('Asetusten haku epäonnistui', virhe);
  }
}

async function lahetaValmisKysymys(kysymys, naytettavaTeksti, viestiJoNaytetty, poissuljettava) {
  if (!viestiJoNaytetty) {
    lisaaViesti(naytettavaTeksti || kysymys, 'kayttaja');
  }

  const vastaus = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ kysymys, asiakas })
  });
  const data = await vastaus.json();
  lisaaViesti(data.vastaus, 'botti');

  naytaPikavalinnatUudelleen(poissuljettava);
}

async function alusta() {
  const headerLogo = document.getElementById('header-logo');
  const headerTeksti = document.getElementById('header-teksti');

  try {
    const asetukset = await fetch('/api/asetukset/' + asiakas).then(r => r.json());
    headerTeksti.textContent = asetukset.nimi;
    document.documentElement.style.setProperty('--paavari', asetukset.paavari);

    if (asetukset.logo) {
      headerLogo.src = asetukset.logo;
      headerLogo.style.display = 'block';
    }

    lisaaViesti(asetukset.tervehdys, 'botti');

    if (asetukset.vainPikavalinnat) {
      document.getElementById('alaosa').style.display = 'none';
    }

    if (asetukset.pikavalinnat && asetukset.pikavalinnat.length > 0) {
      naytaPikavalinnat(asetukset.pikavalinnat);
    }
  } catch (virhe) {
    headerTeksti.textContent = 'Chat';
    lisaaViesti('Hei! Miten voin auttaa?', 'botti');
  }
}
alusta();

async function lahetaKysymys() {
  const kysymys = syote.value.trim();
  if (!kysymys) return;
  lisaaViesti(kysymys, 'kayttaja');
  syote.value = '';

  const vastaus = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ kysymys, asiakas })
  });
  const data = await vastaus.json();
  lisaaViesti(data.vastaus, 'botti');
}

nappi.addEventListener('click', lahetaKysymys);
syote.addEventListener('keypress', (e) => { if (e.key === 'Enter') lahetaKysymys(); });

document.getElementById('sulje').addEventListener('click', () => {
  window.parent.postMessage('sulje-chat', '*');
});

document.getElementById('tyhjenna').addEventListener('click', () => {
  chat.innerHTML = '';
  fetch('/api/asetukset/' + asiakas)
    .then(r => r.json())
    .then(asetukset => {
      lisaaViesti(asetukset.tervehdys, 'botti');
      if (asetukset.vainPikavalinnat) {
        document.getElementById('alaosa').style.display = 'none';
      }
      if (asetukset.pikavalinnat && asetukset.pikavalinnat.length > 0) {
        naytaPikavalinnat(asetukset.pikavalinnat);
      }
    })
    .catch(() => lisaaViesti('Hei! Miten voin auttaa?', 'botti'));
});
</script>
</body>
</html>
