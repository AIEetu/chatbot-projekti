<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; }
  :root { --paavari: #2563eb; }
  body {
    font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
    margin: 0; display: flex; flex-direction: column; height: 100vh;
    background: white;
  }

  #header {
    position: relative;
    background: var(--paavari);
    color: white;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    font-size: 16px;
  }
  #header img {
    width: 32px; height: 32px;
    border-radius: 50%;
    object-fit: cover;
    background: white;
  }
  #sulje {
    position: absolute;
    top: 12px;
    right: 12px;
    background: none;
    border: none;
    color: white;
    font-size: 20px;
    cursor: pointer;
    line-height: 1;
    padding: 4px 8px;
  }
  #sulje:hover { opacity: 0.7; }

  #tyhjenna {
    position: absolute;
    top: 12px;
    left: 12px;
    background: none;
    border: none;
    color: white;
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
    padding: 4px 8px;
  }
  #tyhjenna:hover { opacity: 0.7; }

  #chat {
    flex: 1; padding: 16px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 10px;
    background: white;
  }

  .rivi { display: flex; align-items: flex-end; gap: 8px; }
  .rivi.kayttaja { justify-content: flex-end; }

  .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--paavari); color: white;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0;
  }

  .kupla {
    max-width: 75%; padding: 10px 14px; border-radius: 16px;
    font-size: 14px; line-height: 1.4;
  }
  .kayttaja .kupla {
    background: var(--paavari); color: white; border-bottom-right-radius: 4px;
  }
  .botti .kupla {
    background: #f1f3f5; color: #1f2937; border-bottom-left-radius: 4px;
  }

  #alaosa {
    display: flex; align-items: center;
    padding: 12px; border-top: 1px solid #eee; gap: 8px;
  }
  #syote {
    flex: 1; padding: 10px 14px; border: 1px solid #ddd;
    border-radius: 20px; font-size: 14px; outline: none;
  }
  #syote:focus { border-color: var(--paavari); }
  #laheta {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--paavari); color: white; border: none;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
</style>
</head>
<body>

<div id="header">
  <button id="tyhjenna" title="Aloita uusi keskustelu">↺</button>
  <img id="header-logo" src="" alt="" style="display:none;">
  <span id="header-teksti">Ladataan...</span>
  <button id="sulje">✕</button>
</div>
<div id="chat"></div>
<div id="alaosa">
  <input id="syote" type="text" placeholder="Kirjoita viesti...">
  <button id="laheta">➤</button>
</div>

<script>
const chat = document.getElementById('chat');
const syote = document.getElementById('syote');
const nappi = document.getElementById('laheta');


const urlParametrit = new URLSearchParams(window.location.search);
const asiakas = urlParametrit.get('asiakas') || 'turun-lukko';

function lisaaViesti(teksti, luokka) {
  const rivi = document.createElement('div');
  rivi.className = 'rivi ' + luokka;

  if (luokka === 'botti') {
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = '🤖';
    rivi.appendChild(avatar);
  }

  const kupla = document.createElement('div');
  kupla.className = 'kupla';
  kupla.textContent = teksti;
  rivi.appendChild(kupla);

  chat.appendChild(rivi);
  chat.scrollTop = chat.scrollHeight;
}

async function alusta() {
  const headerLogo = document.getElementById('header-logo');
  const headerTeksti = document.getElementById('header-teksti');

  try {
    const asetukset = await fetch('/api/asetukset/' + asiakas).then(r => r.json());
    headerTeksti.textContent =asetukset.nimi;
    document.documentElement.style.setProperty('--paavari', asetukset.paavari);

    if (asetukset.logo) {
      headerLogo.src = asetukset.logo;
      headerLogo.style.display = 'block';
    }

    lisaaViesti(asetukset.tervehdys, 'botti');
  } catch (virhe) {
    headerTeksti.textContent = 'Chat';
    lisaaViesti('Hei! Miten voin auttaa?', 'botti');
  }
}
alusta();

async function lahetaKysymys() {
  const kysymys = syote.value.trim();
  if (!kysymys) return;
  lisaaViesti(kysymys, 'kayttaja');
  syote.value = '';

  const vastaus = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ kysymys, asiakas })
  });
  const data = await vastaus.json();
  lisaaViesti(data.vastaus, 'botti');
}

nappi.addEventListener('click', lahetaKysymys);
syote.addEventListener('keypress', (e) => { if (e.key === 'Enter') lahetaKysymys(); });

document.getElementById('sulje').addEventListener('click', () => {
  window.parent.postMessage('sulje-chat', '*');
});

document.getElementById('tyhjenna').addEventListener('click', () => {
  chat.innerHTML = '';
  fetch('/api/asetukset/' + asiakas)
    .then(r => r.json())
    .then(asetukset => lisaaViesti(asetukset.tervehdys, 'botti'))
    .catch(() => lisaaViesti('Hei! Miten voin auttaa?', 'botti'));
});
</script>
</body>
</html>
