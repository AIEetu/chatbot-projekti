<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
    margin: 0; display: flex; flex-direction: column; height: 100vh;
    background: white;
  }

  /* Yläpalkki */
  #header {
    background: #2563eb;
    color: white;
    padding: 20px 16px 16px;
    text-align: center;
    font-weight: 600;
    font-size: 16px;
  }

  /* Chat-alue */
  #chat {
    flex: 1; padding: 16px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 10px;
    background: white;
  }

  .rivi { display: flex; align-items: flex-end; gap: 8px; }
  .rivi.kayttaja { justify-content: flex-end; }

  .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: #2563eb; color: white;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0;
  }

  .kupla {
    max-width: 75%; padding: 10px 14px; border-radius: 16px;
    font-size: 14px; line-height: 1.4;
  }
  .kayttaja .kupla {
    background: #2563eb; color: white; border-bottom-right-radius: 4px;
  }
  .botti .kupla {
    background: #f1f3f5; color: #1f2937; border-bottom-left-radius: 4px;
  }

  /* Syöttöalue */
  #alaosa {
    display: flex; align-items: center;
    padding: 12px; border-top: 1px solid #eee; gap: 8px;
  }
  #syote {
    flex: 1; padding: 10px 14px; border: 1px solid #ddd;
    border-radius: 20px; font-size: 14px; outline: none;
  }
  #syote:focus { border-color: #2563eb; }
  #laheta {
    width: 36px; height: 36px; border-radius: 50%;
    background: #2563eb; color: white; border: none;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  #laheta:hover { background: #1d4ed8; }
</style>
</head>
<body>

<div id="header">Keskustele Turun lukon kanssa</div>
<div id="chat"></div>
<div id="alaosa">
  <input id="syote" type="text" placeholder="Kirjoita viesti...">
  <button id="laheta">➤</button>
</div>

<script>
const chat = document.getElementById('chat');
const syote = document.getElementById('syote');
const nappi = document.getElementById('laheta');

function lisaaViesti(teksti, luokka) {
  const rivi = document.createElement('div');
  rivi.className = 'rivi ' + luokka;

  if (luokka === 'botti') {
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = '🤖';
    rivi.appendChild(avatar);
  }

  const kupla = document.createElement('div');
  kupla.className = 'kupla';
  kupla.textContent = teksti;
  rivi.appendChild(kupla);

  chat.appendChild(rivi);
  chat.scrollTop = chat.scrollHeight;
}

// Tervehdysviesti heti kun chat avautuu
lisaaViesti('Hei! Miten voin auttaa sinua tänään?', 'botti');

async function lahetaKysymys() {
  const kysymys = syote.value.trim();
  if (!kysymys) return;
  lisaaViesti(kysymys, 'kayttaja');
  syote.value = '';

  const vastaus = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ kysymys })
  });
  const data = await vastaus.json();
  lisaaViesti(data.vastaus, 'botti');
}

nappi.addEventListener('click', lahetaKysymys);
syote.addEventListener('keypress', (e) => { if (e.key === 'Enter') lahetaKysymys(); });
</script>
</body>
</html>
